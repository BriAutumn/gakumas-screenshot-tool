[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gakumas-screenshot-tool"
version = "0.5.34"
description = "Offline screenshot recognition, reviewed Loadout JSON and GKTools URL export"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
recognition = ["numpy==2.5.3", "pillow==12.3.0", "onnxruntime==1.30.0", "rapidocr-onnxruntime==1.2.3", "opencv-python==5.0.0.93"]

[project.scripts]
gkshot = "gkshot.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
